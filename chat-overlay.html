<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Stream Chat Overlay</title>
<style>
  :root{
    --tiktok-a:#FE2C55;
    --tiktok-b:#25F4EE;
    --youtube:#FF0033;
    --twitch:#9146FF;
    --kick:#53FC18;
    --panel-bg: rgba(12,12,16,0.55);
    --text-main:#F5F5F7;
    --text-dim:#B9B9C2;
  }
  html,body{
    margin:0; padding:0; background:transparent;
    font-family:'Segoe UI', 'Inter', Arial, sans-serif;
    overflow:hidden;
  }
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:flex-end;
    padding:24px;
    pointer-events:none;
  }
  #chat-feed{
    width:420px;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:8px;
    overflow:hidden;
  }
  .msg{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--panel-bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius:12px;
    padding:9px 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    border-left:4px solid transparent;
    animation: slideIn .35s ease-out, fadeHold 12s ease forwards;
    transform-origin:left center;
  }
  @keyframes slideIn{
    from{ opacity:0; transform: translateX(-24px) scale(.96); }
    to{ opacity:1; transform: translateX(0) scale(1); }
  }
  @keyframes fadeHold{
    0%{opacity:1;}
    88%{opacity:1;}
    100%{opacity:0;}
  }
  .icon{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    margin-top:1px;
  }
  .body{ display:flex; flex-direction:column; min-width:0; }
  .top-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .platform-tag{
    font-size:10px;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    padding:1px 6px;
    border-radius:5px;
    color:#0c0c10;
  }
  .username{
    font-size:13.5px;
    font-weight:700;
    color:var(--text-main);
  }
  .comment{
    font-size:13.5px;
    color:var(--text-main);
    word-break:break-word;
    line-height:1.35;
    margin-top:2px;
  }

  /* Platform accent variants */
  .tiktok{ border-left-color: var(--tiktok-a); }
  .tiktok .icon{ background: linear-gradient(135deg,var(--tiktok-a),var(--tiktok-b)); color:#fff; }
  .tiktok .platform-tag{ background: linear-gradient(135deg,var(--tiktok-a),var(--tiktok-b)); }

  .youtube{ border-left-color: var(--youtube); }
  .youtube .icon{ background: var(--youtube); color:#fff; }
  .youtube .platform-tag{ background: var(--youtube); color:#fff; }

  .twitch{ border-left-color: var(--twitch); }
  .twitch .icon{ background: var(--twitch); color:#fff; }
  .twitch .platform-tag{ background: var(--twitch); color:#fff; }

  .kick{ border-left-color: var(--kick); }
  .kick .icon{ background: var(--kick); color:#0c0c10; }
  .kick .platform-tag{ background: var(--kick); }

  /* ---- demo control panel (tidak ikut ke OBS, hilangkan saat dipakai live) ---- */
  #demo-panel{
    position:fixed; top:16px; right:16px;
    background:rgba(20,20,24,0.85);
    border-radius:10px;
    padding:10px;
    display:flex; gap:6px;
    font-family:Arial, sans-serif;
    font-size:12px;
    z-index:999;
  }
  #demo-panel button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    font-weight:700;
    color:#fff;
  }
  #demo-panel button.tiktok-btn{ background:linear-gradient(135deg,var(--tiktok-a),var(--tiktok-b)); }
  #demo-panel button.youtube-btn{ background:var(--youtube); }
  #demo-panel button.twitch-btn{ background:var(--twitch); }
  #demo-panel button.kick-btn{ background:var(--kick); color:#0c0c10; }
</style>
</head>
<body>

<div id="stage">
  <div id="chat-feed"></div>
</div>

<!-- Panel ini cuma buat testing tampilan, hapus div ini saat dipakai sebagai Browser Source di OBS -->
<div id="demo-panel">
  <button class="tiktok-btn" onclick="demoAdd('tiktok')">+ TikTok</button>
  <button class="youtube-btn" onclick="demoAdd('youtube')">+ YouTube</button>
  <button class="twitch-btn" onclick="demoAdd('twitch')">+ Twitch</button>
  <button class="kick-btn" onclick="demoAdd('kick')">+ Kick</button>
</div>

<script>
const feed = document.getElementById('chat-feed');
const MAX_VISIBLE = 8;

const PLATFORM_META = {
  tiktok:  { label:'TikTok',  icon:'♪' },
  youtube: { label:'YouTube', icon:'▶' },
  twitch:  { label:'Twitch',  icon:'◆' },
  kick:    { label:'Kick',    icon:'K' },
};

// Fungsi utama: panggil ini dari sumber data real (WebSocket/API) tiap platform
function addChatMessage(platform, username, comment){
  const meta = PLATFORM_META[platform];
  if(!meta) return;

  const el = document.createElement('div');
  el.className = `msg ${platform}`;
  el.innerHTML = `
    <div class="icon">${meta.icon}</div>
    <div class="body">
      <div class="top-row">
        <span class="platform-tag">${meta.label}</span>
        <span class="username">${escapeHtml(username)}</span>
      </div>
      <div class="comment">${escapeHtml(comment)}</div>
    </div>
  `;

  feed.appendChild(el);

  // hapus pesan paling atas saat kebanyakan
  while(feed.children.length > MAX_VISIBLE){
    feed.removeChild(feed.firstChild);
  }

  // auto-remove setelah animasi fade selesai (~12s)
  setTimeout(()=>{ el.remove(); }, 12000);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- DEMO DATA (hapus saat sudah connect ke API real) ---------- */
const demoUsers = {
  tiktok:  ['ulfa.gg','rzy_fr','dreamy_lampung'],
  youtube: ['ArdiansyahYT','GamerSejati99','LampungGaming'],
  twitch:  ['xX_NightOwl_Xx','potato_streamer','vexxyy'],
  kick:    ['kickfan21','rajaclutch','SiBontot'],
};
const demoComments = [
  'gg banget itu tadi!',
  'lanjut push rank dong',
  'halo kak, baru nonton nih',
  'wkwkwk kena headshot mulu',
  'mantap permainannya',
  'kapan main bareng subscriber?',
  'min, fps drop ga di situ?',
  'first time nonton, keren!',
];

function demoAdd(platform){
  const users = demoUsers[platform];
  const u = users[Math.floor(Math.random()*users.length)];
  const c = demoComments[Math.floor(Math.random()*demoComments.length)];
  addChatMessage(platform, u, c);
}
</script>

</body>
</html>
